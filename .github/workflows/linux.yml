name: Build Linux Flatpak
on:
  workflow_dispatch:
  push:
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
      - "logo.svg"
      - "LICENSE"
permissions:
  contents: read
jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - uses: actions/cache@v4
        with:
          path: linux/flatpak/.flatpak-builder
          key: flatpak-${{ runner.os }}-${{ hashFiles('linux/flatpak/io.github.SevenMyo.MyMirror.json') }}
          restore-keys: flatpak-${{ runner.os }}-
      - name: Build Flatpak
        run: dbus-run-session -- sh linux/flatpak/build.sh
      - name: Install and check application
        run: |
          flatpak install --user --noninteractive linux/flatpak/MyMirror-Linux-x86_64.flatpak
          dbus-run-session -- xvfb-run -a flatpak run --command=python3 io.github.SevenMyo.MyMirror -c "import tkinter; r=tkinter.Tk(); r.update(); r.destroy(); print('Tk GUI OK')"
          flatpak run --command=uxplay io.github.SevenMyo.MyMirror -h
      - uses: actions/upload-artifact@v4
        with:
          name: MyMirror-Linux-x86_64
          path: linux/flatpak/MyMirror-Linux-x86_64.flatpak
          if-no-files-found: error
